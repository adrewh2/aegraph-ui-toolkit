<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aegraph</title>
    <!-- The boot screen from the first paint: the React one below is the same markup, so the page never flashes between. -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #faf9f6; color: #6d6b66; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .boot__mark { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 28px; font-weight: 600; letter-spacing: -0.01em; color: #1f1e1b; }
      .boot__bar { width: 120px; height: 2px; border-radius: 1px; background: #e6e3dc; overflow: hidden; }
      .boot__bar::after { content: ''; display: block; width: 40%; height: 100%; background: #1f1e1b; animation: boot-slide 1.1s ease-in-out infinite; }
      .boot__phase { font-size: 13px; min-height: 1.2em; }
      @keyframes boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status"><div class="boot__mark">aegraph</div><div class="boot__bar"></div><div class="boot__phase">Loading workspace…</div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
